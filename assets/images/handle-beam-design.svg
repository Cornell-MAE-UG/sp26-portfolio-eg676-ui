<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <style>
    .lbl { fill: #111; }
    .dim { stroke: #333; stroke-width: 1; fill: none; }
    .dim-text { fill: #333; font-size: 12px; }
    .force-nut { stroke: #c0392b; fill: #c0392b; stroke-width: 2; }
    .force-act { stroke: #1f4e8c; fill: #1f4e8c; stroke-width: 2; }
    .beam { fill: #d8d8d8; stroke: #111; stroke-width: 2; }
    .ibeam { fill: #aac6e3; stroke: #111; stroke-width: 1.5; }
    .heading { font-size: 16px; font-weight: 700; }
    .title { font-size: 19px; font-weight: 700; }
    .small { font-size: 12px; }
  </style>

  <text x="400" y="28" text-anchor="middle" class="title">Nutcracker Handle — Beam Model and Cross-Section</text>

  <!-- =============================================== -->
  <!-- (1) Side view: cantilever beam loading diagram  -->
  <!-- =============================================== -->
  <text x="400" y="62" text-anchor="middle" class="heading">Loading diagram (side view)</text>

  <!-- Wall with hatching on the left (cantilever support) -->
  <line x1="60" y1="100" x2="60" y2="200" stroke="#111" stroke-width="2"/>
  <g stroke="#111" stroke-width="1">
    <line x1="40" y1="105" x2="60" y2="125"/>
    <line x1="40" y1="120" x2="60" y2="140"/>
    <line x1="40" y1="135" x2="60" y2="155"/>
    <line x1="40" y1="150" x2="60" y2="170"/>
    <line x1="40" y1="165" x2="60" y2="185"/>
    <line x1="40" y1="180" x2="60" y2="200"/>
  </g>
  <text x="50" y="220" text-anchor="middle" class="lbl small">A (pivot)</text>

  <!-- Beam: scale 3 px / mm, length 192 mm = 576 px -->
  <rect class="beam" x="60" y="140" width="576" height="20"/>

  <!-- F_nut: upward, at x = 14 mm = 60 + 42 = 102 -->
  <line class="force-nut" x1="102" y1="215" x2="102" y2="160"/>
  <polygon class="force-nut" points="96,170 108,170 102,158"/>
  <text x="102" y="232" text-anchor="middle" class="lbl" font-weight="bold" fill="#c0392b">F_nut = 1000 N</text>
  <text x="102" y="248" text-anchor="middle" class="dim-text">at x = 14 mm</text>

  <!-- F_act: downward, at x = 192 mm = 60 + 576 = 636 -->
  <line class="force-act" x1="636" y1="80" x2="636" y2="140"/>
  <polygon class="force-act" points="630,128 642,128 636,142"/>
  <text x="636" y="70" text-anchor="middle" class="lbl" font-weight="bold" fill="#1f4e8c">F_act = 73 N</text>
  <text x="636" y="56" text-anchor="middle" class="dim-text">at tip (x = L)</text>

  <!-- Dimension: L = 192 mm -->
  <g class="dim">
    <line x1="60" y1="280" x2="636" y2="280"/>
    <line x1="60" y1="273" x2="60" y2="287"/>
    <line x1="636" y1="273" x2="636" y2="287"/>
  </g>
  <text x="348" y="298" text-anchor="middle" class="dim-text">L = 192 mm</text>

  <!-- Dimension: a = 14 mm -->
  <g class="dim">
    <line x1="60" y1="262" x2="102" y2="262"/>
    <line x1="60" y1="257" x2="60" y2="267"/>
    <line x1="102" y1="257" x2="102" y2="267"/>
  </g>
  <text x="81" y="255" text-anchor="middle" class="dim-text">a = 14</text>

  <!-- divider -->
  <line x1="80" y1="340" x2="720" y2="340" stroke="#bbb" stroke-width="1"/>

  <!-- =============================================== -->
  <!-- (2) Cross-section: I-beam, scale 10 px / mm     -->
  <!-- =============================================== -->
  <text x="400" y="370" text-anchor="middle" class="heading">Cross-section: I-beam, 6061-T6 aluminum</text>

  <!-- Outer envelope: h = 12 mm = 120 px, b = 8 mm = 80 px -->
  <!-- centered at x=300, top at y=400, bottom at y=520 -->
  <!-- top flange: x 260..340, y 400..415 -->
  <!-- bottom flange: x 260..340, y 505..520 -->
  <!-- web: centered, width 15 -> x 292.5..307.5, y 415..505 -->
  <g class="ibeam">
    <rect x="260" y="400" width="80" height="15"/>
    <rect x="292.5" y="415" width="15" height="90"/>
    <rect x="260" y="505" width="80" height="15"/>
  </g>

  <!-- h = 12 mm dimension on right of cross-section -->
  <g class="dim">
    <line x1="360" y1="400" x2="360" y2="520"/>
    <line x1="354" y1="400" x2="366" y2="400"/>
    <line x1="354" y1="520" x2="366" y2="520"/>
  </g>
  <text x="372" y="464" text-anchor="start" class="dim-text">h = 12 mm</text>

  <!-- b = 8 mm dimension above top flange -->
  <g class="dim">
    <line x1="260" y1="385" x2="340" y2="385"/>
    <line x1="260" y1="379" x2="260" y2="391"/>
    <line x1="340" y1="379" x2="340" y2="391"/>
  </g>
  <text x="300" y="377" text-anchor="middle" class="dim-text">b = 8 mm</text>

  <!-- t_f = 1.5 dimension on left, top flange -->
  <g class="dim">
    <line x1="240" y1="400" x2="240" y2="415"/>
    <line x1="234" y1="400" x2="246" y2="400"/>
    <line x1="234" y1="415" x2="246" y2="415"/>
  </g>
  <text x="232" y="412" text-anchor="end" class="dim-text">t_f = 1.5</text>

  <!-- t_w = 1.5 dimension below web -->
  <g class="dim">
    <line x1="292.5" y1="540" x2="307.5" y2="540"/>
    <line x1="292.5" y1="534" x2="292.5" y2="546"/>
    <line x1="307.5" y1="534" x2="307.5" y2="546"/>
  </g>
  <text x="300" y="558" text-anchor="middle" class="dim-text">t_w = 1.5</text>

  <!-- Neutral axis arrow -->
  <line x1="220" y1="460" x2="350" y2="460" stroke="#666" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="216" y="463" text-anchor="end" class="dim-text" font-style="italic">neutral axis</text>

  <!-- Properties summary on the right -->
  <g font-size="14">
    <text x="460" y="410" class="lbl" font-weight="bold">Properties</text>
    <text x="460" y="432" class="lbl">Material: 6061-T6 Al</text>
    <text x="460" y="452" class="lbl">E = 69 GPa</text>
    <text x="460" y="472" class="lbl">I = 757 mm⁴</text>
    <text x="460" y="492" class="lbl">A = 37.5 mm²</text>
    <text x="460" y="512" class="lbl">mass = 19.4 g per handle</text>
    <text x="460" y="532" class="lbl" font-weight="bold" fill="#1f4e8c">δ_tip = 2.95 mm (1.54% of L)</text>
  </g>

  <text x="400" y="600" text-anchor="middle" class="dim-text" font-style="italic">Dimensions in mm. Beam diagram drawn to scale (3 px/mm); cross-section enlarged (10 px/mm) for clarity.</text>
</svg>
